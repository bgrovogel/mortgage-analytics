name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Minimum line and branch coverage, in percent. Below this the build fails (test-first gate).
  COVERAGE_THRESHOLD: 85

jobs:
  backend:
    name: .NET build, tests & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          # NuGet packages are cached, keyed on the lock files.
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet tool restore
      # Locked mode: fails if a project's packages no longer match its packages.lock.json.
      - run: dotnet restore MortgageAnalytics.sln --locked-mode
      - run: dotnet build MortgageAnalytics.sln -c Release --no-restore
      # No NuGet package with a known vulnerability, direct or transitive.
      - name: Vulnerable packages
        run: |
          dotnet list MortgageAnalytics.sln package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
      # Includes the convention tests, so a missing assertion message or Assert.Multiple fails the build. The
      # PostgreSQL tests start a database container, so they run locally (docs/07-testing.md), not on CI's minutes.
      - run: dotnet test MortgageAnalytics.sln -c Release --no-build --filter "TestCategory!=Postgres" --collect:"XPlat Code Coverage" --results-directory ./coverage
      - name: Coverage report
        run: >
          dotnet reportgenerator
          -reports:"coverage/**/coverage.cobertura.xml"
          -targetdir:coverage/report
          "-reporttypes:JsonSummary;MarkdownSummaryGithub;Html"
      - name: Publish coverage summary
        run: cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce coverage threshold
        run: |
          jq -r '.summary | "Lines \(.linecoverage)%  Branches \(.branchcoverage)%"' coverage/report/Summary.json
          jq -e --argjson min "$COVERAGE_THRESHOLD" \
            '.summary.linecoverage >= $min and .summary.branchcoverage >= $min' coverage/report/Summary.json \
            || { echo "::error::Backend coverage is below ${COVERAGE_THRESHOLD}%"; exit 1; }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: coverage/report

  frontend:
    name: Angular lint, unit tests & coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # No known vulnerability in what ships to the browser. Development tools are reviewed instead (docs/07-testing.md).
      - run: npm audit --omit=dev
      # angular-eslint: TypeScript and template rules, including the template accessibility checks.
      - run: npm run lint
      # Jest and Playwright only strip the types, so the specs, page objects and test builders are type-checked here.
      - run: npm run typecheck
      # jest.config.js sets an 85% threshold on statements, branches, functions and lines.
      - run: npm test -- --ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: client/coverage

  e2e:
    name: Angular build & Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          # NuGet packages are cached, keyed on the lock files.
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run e2e:install
      # Builds the production app and runs it from the API, as the container does, under its security headers.
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report

  mutation:
    name: Mutation testing (domain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet tool restore
      # Stryker.NET changes the domain code in small ways (< to <=, + to -, a deleted line) and checks a test fails
      # each time. stryker-config.json fails the job below a 95% mutation score.
      - run: dotnet stryker
        working-directory: tests/MortgageAnalytics.Domain.Tests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: tests/MortgageAnalytics.Domain.Tests/StrykerOutput/*/reports/

  docs:
    name: Docs match the test counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: python3 -m unittest discover tools/doc-check
      # Counts the tests with the test tools themselves (listing, not running, where they can) and fails when a
      # number in the README or docs/ is out of date, naming the file and line.
      - run: python3 tools/doc-check/doc_counts.py

  docker:
    name: Docker image builds & runs
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t mortgage-analytics:ci .
      # Prove the image runs, not just that it builds: it must start, create its database, report healthy,
      # and serve the app with its security headers.
      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8080:8080 mortgage-analytics:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 2; done
          echo
          curl -sf http://localhost:8080/health | grep -qx Healthy || { docker logs smoke; exit 1; }
          curl -sf http://localhost:8080/ | grep -q '<app-root>' || { echo "::error::The app is not served"; exit 1; }
          curl -sfI http://localhost:8080/ | grep -qi "^content-security-policy:" || { echo "::error::No CSP header"; exit 1; }
          loan='{"homePrice":400000,"downPayment":80000,"annualInterestRate":6.5,"termInMonths":360}'
          curl -sf -X POST http://localhost:8080/api/v1/amortization/calculate -H 'Content-Type: application/json' -d "$loan" | grep -q '"baseline"' || { echo "::error::The calculator API did not answer"; exit 1; }
