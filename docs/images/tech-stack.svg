<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="960" height="452" role="img" aria-labelledby="title desc">
<title id="title">The tech stack</title>
<desc id="desc">Frontend: Angular 22, TypeScript 6.0, signals, RxJS 7.8, SVG charts, Instrument Sans. Backend: ASP.NET Core 10 minimal APIs, FluentValidation 12, Identity, MailKit 4, Swashbuckle 10. Data: EF Core 10 and SQLite or PostgreSQL. Quality: NUnit 5, NSubstitute 6, Jest 30, Playwright 1.64, axe-core, Stryker.NET 5.0 and Python Decimal models. Delivery: Docker, docker compose with Mailpit, GitHub Actions.</desc>
