# A fixed project name, so containers and volumes are "mortgage-analytics-*" whatever the folder is called.
name: mortgage-analytics

services:
  app:
    build: .
    image: mortgage-analytics:local
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Account emails (confirmation, password reset) go to Mailpit below: open http://localhost:8025 to read them.
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: "1025"
      Email__PublicUrl: http://localhost:8080
      # The HTTPS proxy below, and only it, may say which client and scheme a request came from.
      ForwardedHeaders__KnownProxies__0: 172.30.0.10
    volumes:
      - calculations:/data
    depends_on:
      - mailpit

  # A local mail catcher: it accepts every email and shows it in a web inbox. Nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  # Optional HTTPS in front of the app: `docker compose --profile https up`, then https://localhost:8443. Over HTTPS the
  # session cookie is marked Secure. HSTS is sent too, under any real host name: ASP.NET Core leaves it off for
  # localhost, so a browser is never held to HTTPS on a developer's machine.
  https:
    image: caddy:2.10.0
    profiles: [https]
    ports:
      - "8443:8443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      default:
        ipv4_address: 172.30.0.10
    depends_on:
      - app

  # Optional: the app as it would scale out. `docker compose --profile cluster up`, then http://localhost:8090: two
  # instances on one PostgreSQL database, behind a load balancer that takes turns between them. They keep the keys
  # that sign sessions in that database, so a session started on one is signed in on the other.
  postgres:
    image: postgres:17-alpine
    profiles: [cluster]
    environment:
      POSTGRES_DB: calculations
      POSTGRES_USER: mortgage
      # A demo password on a database no port leads to; a real deployment takes it from a secret store.
      POSTGRES_PASSWORD: mortgage
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mortgage", "-d", "calculations"]
      interval: 2s
      retries: 15

  app-1: &cluster-app
    image: mortgage-analytics:local
    profiles: [cluster]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      ConnectionStrings__Calculations: Host=postgres;Database=calculations;Username=mortgage;Password=mortgage
      DataProtection__Store: Database
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: "1025"
      Email__PublicUrl: http://localhost:8090
      ForwardedHeaders__KnownProxies__0: 172.30.0.11
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  app-2: *cluster-app

  balancer:
    image: caddy:2.10.0
    profiles: [cluster]
    ports:
      - "8090:8090"
    volumes:
      - ./caddy/Cluster.Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      default:
        ipv4_address: 172.30.0.11
    depends_on:
      - app-1
      - app-2

# A fixed range, so the proxy's address (trusted above) is always the same.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  calculations:
  postgres:
