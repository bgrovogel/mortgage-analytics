<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 428" width="960" height="428" role="img" aria-labelledby="title desc">
<title id="title">Mortgage Analytics architecture</title>
<desc id="desc">The Angular app calls one ASP.NET Core process. Inside it, Api calls Application, which calls Domain; Infrastructure implements Application&#x27;s repository port and stores data in SQLite. Dependencies point inward, and Domain depends on nothing.</desc>
