@if (store.result(); as r) {
  <!-- Phones only, and only while the headline numbers are off screen. -->
  <div class="summary-bar" [class.hidden]="store.headlineVisible()" data-testid="summary-bar" aria-hidden="true">
    <span><strong>{{ r.baseline.totalMonthlyPayment | currency: 'USD' : 'symbol' : '1.0-0' }}/mo</strong></span>
    <span>Save <strong>{{ r.savings.netSavings | currency: 'USD' : 'symbol' : '1.0-0' }}</strong></span>
    @if (store.busy()) {
      <span class="updating">Updating…</span>
    }
  </div>
}

<app-calculation-page [store]="store" [problems]="problems()" [announce]="false" placeholder="Calculating your schedule…"
                      errorTitle="We couldn't run that calculation.">
  <app-loan-form form [initial]="startFrom" (calculate)="store.send($event)" (problems)="problems.set($event)" />

  <nav tabs class="result-tabs" aria-label="Results">
    @for (tab of tabs; track tab.path) {
      <a [routerLink]="tab.path" routerLinkActive="active" ariaCurrentWhenActive="page"
         [attr.data-testid]="'result-tab-' + tab.path">{{ tab.label }}</a>
    }
  </nav>

  @if (store.result()) {
    <router-outlet />
  }
</app-calculation-page>
