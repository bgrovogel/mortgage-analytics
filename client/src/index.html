<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mortgage Analytics</title>
  <meta name="description" content="See what a home really costs, how extra payments or a refinance change it, and whether to pay it off or invest.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The brand mark; the PNG is the same mark for iOS home screens, which do not take SVG. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- What an install uses: the name, the icons (one that survives a mask) and how the app opens. -->
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Mobile browsers tint their toolbar to the header bar, in light and in dark mode. -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141b2b" media="(prefers-color-scheme: dark)">
</head>
<body>
  <app-root></app-root>
</body>
</html>
