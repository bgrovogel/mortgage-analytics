<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
<title id="title">The amortization engine</title>
<desc id="desc">AmortizationService depends on ILoanComparer and TimeProvider. LoanComparer depends on IAmortizationCalculator and applies a HousingCostPlan. The calculator asks an ExtraPaymentPlan for each month&#x27;s extra payment; the plan sums any number of IExtraPaymentRule implementations. HousingCostPlan sums any number of IHousingCost implementations.</desc>
