name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: .NET build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore MortgageAnalytics.sln
      - run: dotnet build MortgageAnalytics.sln -c Release --no-restore
      - run: dotnet test MortgageAnalytics.sln -c Release --no-build --collect:"XPlat Code Coverage" --results-directory ./coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage

  e2e:
    name: Angular build & Playwright E2E
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run e2e:install
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t mortgage-analytics:ci .
