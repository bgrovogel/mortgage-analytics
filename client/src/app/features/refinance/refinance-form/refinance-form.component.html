<form [formGroup]="form" novalidate data-testid="refinance-form">
  <fieldset>
    <legend>Your loan today</legend>

    <app-number-field [control]="form.controls.currentBalance" [rule]="rules.currentBalance" testId="current-balance" />

    <div class="row">
      <app-number-field [control]="form.controls.currentAnnualInterestRate" [rule]="rules.currentAnnualInterestRate" testId="current-rate" label="Interest rate" />
      <app-number-field [control]="form.controls.yearsLeft" [rule]="rules.yearsLeft" testId="years-left" />
    </div>
  </fieldset>

  <fieldset>
    <legend>The new loan</legend>

    <div class="row">
      <app-number-field [control]="form.controls.newAnnualInterestRate" [rule]="rules.newAnnualInterestRate" testId="new-rate" label="Interest rate" />
      <label class="field">
        <span>Term</span>
        <select formControlName="newTerm" data-testid="new-term">
          @for (years of terms; track years) {
            <option [value]="'' + years">{{ years }} years</option>
          }
          <option value="keep">Keep my payoff date ({{ remainingLabel() }})</option>
        </select>
      </label>
    </div>

    <app-number-field [control]="form.controls.closingCosts" [rule]="rules.closingCosts" testId="closing-costs" />
    <p class="hint">Lender fees, points, appraisal and title. Often 2% to 5% of the loan.</p>

    <label class="checkbox">
      <input type="checkbox" formControlName="financeClosingCosts" data-testid="finance-closing-costs" />
      <span><strong>Add them to the loan</strong> instead of paying at closing</span>
    </label>
  </fieldset>

  <p class="auto-note">Results update as you type.</p>
</form>
