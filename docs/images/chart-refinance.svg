<title id="title">The refinance trap</title>
<desc id="desc">$300,000 left at 7% with 25 years to go, refinanced to 6% for a new 30 years with $6,000 closing costs. The payment falls by $321.69 and it breaks even at payment 25, but the new loan runs 60 payments longer and costs $17,415.28 more overall.</desc>
